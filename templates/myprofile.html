<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <title>PlateMate - My Profile</title>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  
  <script>
    // Your Firebase configuration here
    const firebaseConfig = {
      apiKey: "{{ firebase_api_key }}",
      authDomain: "platemate-385014.firebaseapp.com",
      projectId: "platemate-385014",
      storageBucket: "platemate-385014.appspot.com",
      messagingSenderId: "{{ firebase_sender_id }}",
      appId: "{{ firebase_app_id }}"
    };

    // Initialize Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore(app);

function displaySavedRestaurants() {
  const user = auth.currentUser;
  const savedRestaurantsContainer = document.getElementById("savedRestaurantsContainer");

  if (user) {
    db.collection("users")
      .doc(user.uid)
      .collection("savedRestaurants")
      .get()
      .then((querySnapshot) => {
      querySnapshot.forEach((doc) => {
        const restaurant = doc.data();
        const restaurantCard = document.createElement("div");
        restaurantCard.classList.add("col-md-4");
        restaurantCard.setAttribute("id", doc.id);

        const tripadvisorUrl = `https://www.tripadvisor.com/${restaurant.URL_TA}`;

        restaurantCard.innerHTML = `
          <div class="card mb-4 shadow-sm">
            <div class="card-body">
              <h5 class="card-title">${restaurant.name}</h5>
              <div class="card-text">
                 <button class="btn btn-danger wide-button" onclick="unsaveRestaurant('${doc.id}')">Unsave</button>
              </div>
            </div>
          </div>
        `;
        savedRestaurantsContainer.appendChild(restaurantCard);
        });
      })
      .catch((error) => {
        console.error("Error fetching saved restaurants:", error);
      });
  } else {
    alert("Please log in to see your saved restaurants.");
  }
}


function getRatingStars(rating) {
  const fullStars = Math.floor(rating);
  const halfStars = Math.round(rating - fullStars);
  const emptyStars = 5 - fullStars - halfStars;

  const fullStarIcons = '<i class="fas fa-star"></i>'.repeat(fullStars);
  const halfStarIcons = halfStars ? '<i class="fas fa-star-half-alt"></i>' : '';
  const emptyStarIcons = '<i class="far fa-star"></i>'.repeat(emptyStars);

  return fullStarIcons + halfStarIcons + emptyStarIcons;
}


    function unsaveRestaurant(docId) {
      const user = auth.currentUser;
      if (user) {
        db.collection("users")
          .doc(user.uid)
          .collection("savedRestaurants")
          .doc(docId)
          .delete()
          .then(() => {
            const restaurantCard = document.getElementById(docId);
            restaurantCard.remove();
          })
          .catch((error) => {
            console.error("Error unsaving restaurant:", error);
          });
      } else {
        alert("Please log in to unsave restaurants.");
      }
    }
    auth.onAuthStateChanged((user) => {
      if (user) {
        fetchUserData(user);
        updateNavbar();
        displaySavedRestaurants();
      } else {
        window.location.href = "/login";
      }
    });

    function updateNavbar() {
      const loggedInLinks = document.getElementById('loggedInLinks');
      const loggedOutLinks = document.getElementById('loggedOutLinks');

      if (auth.currentUser) {
        loggedInLinks.style.display = 'block';
        loggedOutLinks.style.display = 'none';
      } else {
        loggedInLinks.style.display = 'none';
        loggedOutLinks.style.display = 'block';
      }
    }
    

    function fetchUserData(user) {
      db.collection("users")
        .doc(user.uid)
        .get()
        .then((doc) => {
          if (doc.exists) {
            const userData = doc.data();
            document.getElementById("first_name").innerText = `First Name: ${userData.firstName}`;
            document.getElementById("last_name").innerText = `Last Name: ${userData.lastName}`;
            document.getElementById("email").innerText = `Email: ${userData.email}`;
            document.getElementById("username").innerText = `Username: ${userData.username}`;
          } else {
            console.error(`No document found for user with UID: ${user.uid}`);
          }
        })
        .catch((error) => {
          console.error("Error fetching user data:", error);
    });
}





function updateNavbar() {
  const loggedInLinks = document.getElementById('loggedInLinks');
  const loggedOutLinks = document.getElementById('loggedOutLinks');

  if (auth.currentUser) {
    loggedInLinks.style.display = 'block';
    loggedOutLinks.style.display = 'none';
  } else {
    loggedInLinks.style.display = 'none';
    loggedOutLinks.style.display = 'block';
  }
}

function handleLogout() {
  auth.signOut().then(() => {
    window.location.href = "{{ url_for('home') }}";
  });
}

  </script>
</head>
<body>
{% include 'navbar.html' %}
<div class="container">
  <h1 class="text-center">My Profile</h1>
  <hr>
  <h2>Personal Information</h2>
  <p id="first_name">First Name: </p>
  <p id="last_name">Last Name: </p>
  <p id="email">Email: </p>
  <p id="username">Username: </p>
  <hr>
  <div id="saved-restaurants-container">
    <h2>My Saved Restaurants</h2>
    <div class="saved-restaurants-container" id="savedRestaurantsContainer"></div>
    <button id="load-more-restaurants" class="btn btn-primary">Show More</button>
  </div>
  <hr>
  <a href="{{ url_for('edit_profile') }}" class="btn btn-primary">Edit Profile</a>
  <a href="{{ url_for('delete_account') }}" class="btn btn-danger">Delete Account</a>
</div>
<footer class="footer">
  <div class="container">
    <p>&copy; PlateMate 2023</p>
  </div>
</footer>
<script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
