
{% block content %}
<!DOCTYPE html>
<html lang="en">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <title>PlateMate - Edit Profile</title>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
<head>

</head>
<body>
{% include 'navbar.html' %}
<div class="container">
    <h1 class="text-center">Edit Profile</h1>
    <form id="edit-profile-form">
        <div class="form-group">
            <label for="edit-email">Email:</label>
            <input type="email" class="form-control" id="edit-email" required>
        </div>
        <div class="form-group">
            <label for="edit-first-name">First Name:</label>
            <input type="text" class="form-control" id="edit-first-name" required>
        </div>
        <div class="form-group">
            <label for="edit-last-name">Last Name:</label>
            <input type="text" class="form-control" id="edit-last-name" required>
        </div>
        <div class="form-group">
            <label for="edit-username">Username:</label>
            <input type="text" class="form-control" id="edit-username" required>
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>
</div>
<footer class="footer">
    <div class="container">
        <p>&copy; PlateMate 2023</p>
    </div>
</footer>
<script>
    const firebaseConfig = {
      apiKey: "{{ firebase_api_key }}",
      authDomain: "platemate-385014.firebaseapp.com",
      projectId: "platemate-385014",
      storageBucket: "platemate-385014.appspot.com",
      messagingSenderId: "{{ firebase_sender_id }}",
      appId: "{{ firebase_app_id }}"
    };

    // Initialize Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore(app);

    auth.onAuthStateChanged((user) => {
        if (user) {
            fillExistingData(user);
        } else {
            window.location.href = "{{ url_for('home') }}";
        }
    });
    auth.onAuthStateChanged((user) => {
    if (user) {
        updateNavbar();
    } else {
        window.location.href = "{{ url_for('home') }}";
    }
    });

    function updateNavbar() {
    const loggedInLinks = document.getElementById('loggedInLinks');
    const loggedOutLinks = document.getElementById('loggedOutLinks');

    if (auth.currentUser) {
        loggedInLinks.style.display = 'block';
        loggedOutLinks.style.display = 'none';
    } else {
        loggedInLinks.style.display = 'none';
        loggedOutLinks.style.display = 'block';
    }
    }
function handleLogout() {
    auth.signOut().then(() => {
        window.location.href = "{{ url_for('home') }}";
    });
}
    function fillExistingData(user) {
        db.collection("users")
            .doc(user.uid)
            .get()
            .then((doc) => {
                if (doc.exists) {
                    const userData = doc.data();
                    document.getElementById("edit-first-name").value = userData.firstName;
                    document.getElementById("edit-last-name").value = userData.lastName;
                    document.getElementById("edit-email").value = userData.email;
                    document.getElementById("edit-username").value = userData.username;
                }
            });
    }

    document.getElementById("edit-profile-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const user = auth.currentUser;

        // Update email in Firebase Authentication
        user.updateEmail(document.getElementById("edit-email").value)
            .then(() => {
                // Update user data in Firestore
                return db.collection("users").doc(user.uid).update({
                    firstName: document.getElementById("edit-first-name").value,
                    lastName: document.getElementById("edit-last-name").value,
                    email: document.getElementById("edit-email").value,
                    username: document.getElementById("edit-username").value,
                });
            })
            .then(() => {
                alert("Profile updated successfully.");
                window.location.href = "{{ url_for('my_profile') }}";
            })
            .catch((error) => {
                console.error("Error updating profile:", error);
                alert("Error updating profile. Please try again.");
            });
    });
</script>
<script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>

{% endblock %}
