{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <title>PlateMate - Login</title>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

  <script>

    // Your Firebase configuration here
    const firebaseConfig = {
    apiKey: "{{ firebase_api_key }}",
    authDomain: "platemate-385014.firebaseapp.com",
    projectId: "platemate-385014",
    storageBucket: "platemate-385014.appspot.com",
    messagingSenderId: "{{ firebase_sender_id }}",
    appId: "{{ firebase_app_id }}"
    };

    // Initialize Firebase
// Initialize Firebase
try {
  firebase.initializeApp(firebaseConfig);
} 
catch (error) {
  if (!/already exists/.test(error.message)) {
    console.error('Firebase initialization error:', error.stack);
  }
}

  const { signInAnonymously, signInWithPopup } = firebase.auth;
  const db = firebase.firestore();


    function updateNavbar() {
  const loggedInLinks = document.getElementById('loggedInLinks');
  const loggedOutLinks = document.getElementById('loggedOutLinks');

  if (auth.currentUser) {
    loggedInLinks.style.display = 'block';
    loggedOutLinks.style.display = 'none';
  } else {
    loggedInLinks.style.display = 'none';
    loggedOutLinks.style.display = 'block';
  }
}

auth.onAuthStateChanged((user) => {
  updateNavbar();

  if (user) {
    // Store the user ID in the session
    fetch(`/store_user_id?user_id=${user.uid}`).then((response) => {
      if (response.ok) {
        window.location.href = "{{ url_for('my_profile') }}";
      } else {
        console.error("Failed to store user ID in the session");
      }
    });
  }
});

  </script>
</head>
<body>

{% include 'navbar.html' %}


<div class="container">
  <div class="row justify-content-center mt-5">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">{{ "Login" }}</div>
        <div class="card-body">
          {% with messages = get_flashed_messages() %}
            {% if messages %}
              <div class="alert alert-danger" role="alert">
                <ul class="mb-0">
                  {% for message in messages %}
                    <li>{{ message }}</li>
                  {% endfor %}
                </ul>
              </div>
            {% endif %}
          {% endwith %}
          <form action="{{ url_for('login') }}" method="POST" id="login-form">
          <div class="form-group">
        <label for="email">{{ "Email" }}</label>
        <input type="text" class="form-control" id="email" name="email" placeholder="Email" required>
        </div>
            <div class="form-group">
              <label for="password">{{ "Password" }}</label>
                <input type="password" id="password" name="password" class="form-control" required>
        <div class="form-check mt-2">
        <input class="form-check-input" type="checkbox" id="show-password">
        <label class="form-check-label" for="show-password">{{ "Show Password" }}</label>
        </div>
</div>
<div class="button-container">
  <button type="submit" class="btn btn-primary">{{ "Log In" }}</button>

</div>
<div class="button-container">
  ...
  <a href="#" id="forgot-password" class="mt-2">{{ "Forgot Password?" }}</a>
</div>

</form>
</div>
</div>
</div>
</div>
</div>

<script>


  const loginForm = document.getElementById("login-form");
function fetchUserData(user) {
  // Fetch user data and display personal information
  db.collection("users")
    .doc(user.uid)
    .get()
    .then((doc) => {
      if (doc.exists) {
        const userData = doc.data();
        document.getElementById("first_name").innerText = `First Name: ${userData.firstName}`;
        document.getElementById("last_name").innerText = `Last Name: ${userData.lastName}`;
        document.getElementById("email").innerText = `Email: ${userData.email}`;
        document.getElementById("username").innerText = `Username: ${userData.username}`;
      } else {
        console.error(`No document found for user with UID: ${user.uid}`);
      }
    })
    .catch((error) => {
      console.error("Error fetching user data:", error);
    });
}
  loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {
    const userCredential = await auth.signInWithEmailAndPassword(email, password);
    const user = userCredential.user;

    const response = await fetch("/store_user_id", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ user_id: user.uid })
    });

    if (response.ok) {
      // Call fetchUserData function here
      fetchUserData(user);

      // Redirect to your desired page after successful login
      window.location.href = "{{ url_for('my_profile') }}";
    } else {
      console.error("Failed to store user ID in the session");
    }
  } catch (error) {
    console.error("Failed to authenticate user:", error);
  }
});


async function sendResetEmail(email) {
  try {
    await firebase.auth().sendPasswordResetEmail(email);
    alert('Password reset email has been sent. Please check your inbox.');
  } catch (error) {
    console.error(error);
    alert('Failed to send password reset email. Please try again later.');
  }
}



  document.getElementById('forgot-password').addEventListener('click', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;

    if (!email) {
      alert('Please enter your email address first.');
      return;
    }

    await sendResetEmail(email);
  });


document.getElementById('show-password').addEventListener('change', (e) => {
    const passwordInput = document.getElementById('password');
    if (e.target.checked) {
        passwordInput.type = 'text';
    } else {
        passwordInput.type = 'password';
    }
});
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();

  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  try {
    await firebase.auth().signInWithEmailAndPassword(email, password);
    // Redirect to your desired page after successful login
    window.location.href = "{{ url_for('my_profile') }}";
  } catch (error) {
    // Show error message to the user
    alert(error.message);
  }
});





</script>
<script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
{% endblock %}
